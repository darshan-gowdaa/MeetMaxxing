name: Keep Services Awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          if [ -z "${{ secrets.RENDER_API_URL }}" ]; then
            echo "RENDER_API_URL secret not set. Skipping."
            exit 0
          fi
          # Ping diagnostics endpoint. Hits both Render and Qdrant.
          curl -sS "${{ secrets.RENDER_API_URL }}/api/diagnostics" > /dev/null || echo "Ping failed"
